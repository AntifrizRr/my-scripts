name: portfolio-ci

on:
  push:
    branches:
      - main
      - codex/portfolio-ready
  pull_request:

jobs:
  python-and-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./rename_partners[dev]"
          python -m pip install openpyxl

      - name: Python compile check
        run: |
          python -m compileall rename_partners/src tools

      - name: Ruff
        run: |
          python -m ruff check rename_partners/src rename_partners/tests tools

      - name: Python tests
        run: |
          python -m pytest -q

      - name: Apps Script helper tests
        run: |
          node --test google-apps-script/aff-partners-info/tests/apps_script_helpers.test.js

      - name: Secret scan
        run: |
          python tools/secret_scan.py