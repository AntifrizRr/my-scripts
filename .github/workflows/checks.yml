name: checks

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  code-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./rename_partners[dev]"
          python -m pip install openpyxl

      - name: Compile Python files
        run: python -m compileall rename_partners/partner_automation tools

      - name: Run Ruff
        run: python -m ruff check rename_partners/partner_automation rename_partners/tests tools

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Apps Script helper tests
        run: node --test google-apps-script/aff-partners-info/tests/apps_script_helpers.test.js

      - name: Scan for committed secrets
        run: python tools/secret_scan.py
