[project]
name = "rename-partners"
version = "0.1.0"
description = "Partner name update and spreadsheet synchronization utilities"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "pyotp>=2.8",
  "python-dotenv>=1.0",
  "gspread>=6.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
